baseURL: "https://www.makemendexplore.com/"
theme: E25DX

enableGitInfo: true
enableRobotsTXT: true

disableKinds: [ taxonomy, term ]

defaultContentLanguage: en

languages:
  en:
    weight: 1
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Make. Mend. Explore.
    params:
      description: 

services:
  googleAnalytics:
    ID: G-QRSBN940ZG # To omit, put a ~ here

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  tableOfContents:
    pre: <nav id="TableOfContents" aria-label="Table of Contents">
    post: </nav>

params:
  project:
    startYear: 2026 # To omit, put a ~ here
    presentYear: 2026
    repo:
      main: username/repo
    themeColor:
      light: '#ffffff'
      dark: '#101010'

  author:
    name: Steven Miller
    url: https://github.com/steven70066

  pagination:
    size: 6

  enableOGXSEO: false # No automated OG image generation
  enablePageFind: false # Run pagefind --site dir after build

  services:
    umami: # To omit, put a ~ here & remove id, scriptPath lines
      id: xxx
      scriptPath: https://cloud.umami.is/script.js

menus:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
      params:
        icon: home
    - identifier: outdoors
      name: Outdoors
      pageRef: /outdoors
      weight: 2
      params:
        icon: news
    - identifier: ham
      name: ham
      pageRef: /ham
      weight: 3
      params:
        icon: news
    - identifier: mesh
      name: Mesh Radio
      pageRef: /mesh
      weight: 4
      params:
        icon: news
    - identifier: about
      name: About Me
      pageRef: /page/about
      weight: 5
      params:
        icon: account_circle
